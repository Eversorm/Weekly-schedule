# GitHub Actions: builds the APK on GitHub's servers every time code is pushed to "main",
# runs the unit tests, and publishes the signed APK as a "Release" you can download
# from your phone (repository page > Releases).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows starting a build by hand (Actions tab > Build APK > Run workflow)

permissions:
  contents: write # needed to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with download cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Check that the signing secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret SIGNING_$name is missing. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Restore the signing key from the secret
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Run unit tests and build the signed APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish the APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="weekly-schedule-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          git log -1 --format=%B > notes.txt
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "Build ${{ github.run_number }}" \
            --notes-file notes.txt \
            --target "${{ github.sha }}"
